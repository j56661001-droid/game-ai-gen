  <!-- Google tag (gtag.js) -->
  <script>
    const DEFAULT_GID = "G-938FRNGZ27";
    // Define global gtag function
    window.gtag = function () {};

    async function initGoogleAnalytics() {
      let gid = DEFAULT_GID;
      try {
        // Fetch G-ID from backend API
        // Extract subdomain as code
        const hostname = window.location.hostname;
        const domainParts = hostname.split(".");
        const code = domainParts.length > 2 ? domainParts[0] : "";

        const response = await fetch(`/api/settings/public/gaid${code ? "." + code : ""}`, {
          method: "GET",
          headers: {
            "Content-Type": "application/json",
          },
        });
        if (response.ok) {
          const data = await response.json();
          if (data.success && data.data) {
            gid = data.data.value;
          }
        }
      } catch (error) {
        console.warn("Failed to fetch Google Analytics ID, using default:", error);
        // 使用默认 GID，不抛出错误
      }

      // Load Google Analytics script with the determined GID
      const script = document.createElement("script");
      script.async = true;
      script.src = `https://www.googletagmanager.com/gtag/js?id=${gid}`;
      document.head.appendChild(script);

      // Execute Google Analytics initialization after script loads successfully
      script.onload = function () {
        window.dataLayer = window.dataLayer || [];
        window.gtag = function () {
          dataLayer.push(arguments);
        };
        gtag("js", new Date());
        gtag("config", gid);
      };
    }
    // Initialize Google Analytics
    initGoogleAnalytics();
  </script>
